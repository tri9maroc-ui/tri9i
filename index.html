body{background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px}.mut{color:var(--mut)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:16px;font-size:18px;font-weight:700;color:#fff;border:0;cursor:pointer}
.btn:active{transform:scale(.98)}.sm{min-height:46px;font-size:16px;border-radius:12px}
button:focus-visible,.inp:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.g{background:#15803d}.b{background:#1d3f8f}.o{background:#d9640f}.tg{background:var(--gt)}.to{background:var(--ot)}.tb{background:var(--bt)}
.cb{color:var(--blue)}.co{color:var(--orange)}.cg{color:var(--green)}
.road{flex:1;border-top:4px dashed var(--bd);position:relative;margin:0 10px;min-width:30px}
.road svg{position:absolute;left:50%;top:-14px;transform:translateX(-50%) scaleX(-1);background:var(--card);padding:0 4px}
.row{display:block;width:100%;text-align:start;cursor:pointer}input[type=tel],input[type=number],input[type=password]{direction:ltr}
.pill{font-size:13px;font-weight:700;padding:4px 12px;border-radius:99px;display:inline-block}

 ${su&&d?`<label class="block"><span class="font-bold block mb-1.5">نوع الكاميو</span><select id="a-truck" class="inp"><option>Camionnette 3,5 t</option><option>Camion 8 t</option><option>Camion 10 t</option><option>Semi-remorque 25 t</option><option>Camion frigo</option></select></label>`:''}

 ${L.length?`<div class="grid gap-3">${L.map(r=>card(r,O.filter(o=>o.request_id===r.id).length+' عروض')).join('')}</div>`:'<div class="card p-6 text-center mut">مازال ماعندك حتى طلب.</div>'}${TR}</div>`},

new(){const w=S.wz,st=w.step,T=['الدار البيضاء','الرباط','طنجة','مراكش','فاس','أكادير','وجدة','مكناس'],iso=k=>{const d=new Date();d.setDate(d.getDate()+k);return d.toISOString().slice(0,10)},H=t=>`<h1 class="text-3xl font-extrabold mb-4">${t}</h1>`;

 let b='';
 if(st===0)b=`<div class="card p-4 mb-5 tb" style="border:0"><p class="font-bold mb-2">هضر ولا كتب، والمساعد غادي يعمر ليك الطلب</p><textarea id="ai-txt" rows="3" class="inp" placeholder="مثال: بغيت نصيفط 40 كارتون ديال الحوايج من طنجة لفاس نهار الجمعة بـ 800 درهم"></textarea><div class="flex gap-2 mt-2"><button class="btn b sm" style="width:auto;padding:0 16px" data-act="mic">${ic('mic',20)}هضر</button><button class="btn g sm" data-act="aiparse">${ic('check',20)}فهم</button></div></div>`+cityStep('f','من فين غادي تشحن؟');

 if(st===5)b=H('آخر خطوة')+`<div class="card p-4 mb-4">${route(w.f,w.t,'text-xl')}${kmTag(w.f,w.t)}<p class="mt-2">${esc(w.w)}${w.det?' - '+esc(w.det):''}</p><p class="mt-1 cb font-bold">${fd(w.d)} \u00b7 ${dh(w.b)}</p></div><div class="grid gap-4">${field('w-addr','عنوان التحميل (ما غيبانش حتى التخلاص)','الحي، الزنقة، النمرة')}<label class="block"><span class="font-bold block mb-1.5">شاحنة معينة؟ (اختياري)</span><select id="w-truck" class="inp"><option value="">أي شاحنة</option>${['Camionnette 3,5 t','Camion 8 t','Camion 10 t','Semi-remorque 25 t','Camion frigo'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="flex items-center gap-3 card p-4 font-bold"><input id="w-help" type="checkbox" style="width:24px;height:24px">محتاج مساعدة فالتحميل</label><button class="btn o" data-act="publish">${ic('check')}نشر الطلب</button></div>`;

const upload=async(bucket,f)=>{const b=await shrink(f),p=`${S.me.id}/${Date.now()}.jpg`;await q(sb.storage.from(bucket).upload(p,b,{contentType:'image/jpeg'}));return p};
const pub=p=>sb.storage.from('photos').getPublicUrl(p).data.publicUrl;
const refreshMe=async()=>{S.me=await q(sb.from('profiles').select('*').eq('id',S.me.id).single())};
const av=(m,z)=>m.avatar?`<img loading="lazy" src="${pub(m.avatar)}" alt="" class="rounded-full object-cover shrink-0" style="width:${z}px;height:${z}px">`:`<div class="rounded-full shrink-0 flex items-center justify-center font-extrabold text-white" style="width:${z}px;height:${z}px;background:#1d3f8f;font-size:${z/2.4}px">${esc((m.name||'?')[0].toUpperCase())}</div>`;
const rates=async ids=>{ids=[...new Set(ids)];const o={};if(!ids.length)return o;(await q(sb.from('reviews').select('driver_id,stars').in('driver_id',ids))).forEach(x=>{const a=o[x.driver_id]||(o[x.driver_id]={sum:0,n:0});a.sum+=x.stars;a.n++});Object.values(o).forEach(a=>a.avg=a.sum/a.n);return o};
const dinfo=(d,id)=>{const a=RT[id];return `<div class="flex gap-3 items-start">${av(d,48)}<div><b class="text-lg">${esc(d.name)}</b>${d.verified?` <span class="pill tg cg">${ic('check',12)} موثق</span>`:''}<p class="mut text-sm">${esc(d.truck||'')}${d.capacity?' \u00b7 '+esc(d.capacity):''}${d.city?' \u00b7 '+esc(d.city):''}</p><p class="text-sm">${a?`<span class="co font-bold">\u2605 ${a.avg.toFixed(1)}</span> <span class="mut text-xs">(${a.n})</span>`:'<span class="mut text-xs">جديد</span>'}</p>${(d.truck_photos||[]).length?`<div class="flex gap-1 mt-2">${d.truck_photos.slice(0,3).map(p=>`<img loading="lazy" src="${pub(p)}" alt="Camion" class="w-16 h-12 object-cover rounded-lg">`).join('')}</div>`:''}</div></div>`};
async function head(){const w=document.getElementById('who');if(!S.me){w.innerHTML='';return}try{if(Date.now()-PMT>45000){PMT=Date.now();S.paymode=(await sb.from('app_settings').select('value').eq('key','paymode').maybeSingle()).data?.value||'free'}}catch(e){}
 const {count}=await sb.from('notifs').select('id',{count:'exact',head:true}).eq('read',false),n=count||0;
 w.innerHTML=`<span class="pill ${S.me.role==='driver'?'tb cb':'to co'}">${{shipper:'كليان',driver:'شوفور',admin:'أدمن'}[S.me.role]}</span><button class="relative p-2.5 rounded-xl tb cb min-w-[44px] min-h-[44px] flex items-center justify-center" data-go="notifs" aria-label="الإشعارات">${ic('bell',20)}${n?`<span class="absolute -top-1 -end-1 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center" style="background:#d9640f">${n}</span>`:''}</button><button class="p-2.5 rounded-xl tb cb min-w-[44px] min-h-[44px] flex items-center justify-center" data-go="settings" aria-label="الحساب ديالي">${ic('user',20)}</button><button class="p-2.5 rounded-xl tg cg min-w-[44px] min-h-[44px] flex items-center justify-center" data-act="logout" aria-label="خروج">${ic('out',20)}</button>`}
let LH='';
async function render(){try{const h=await V[S.view]();if(h!==LH){$.innerHTML=h;LH=h}}catch(e){console.error(e)}await head()}
const go=(v,x={})=>{Object.assign(S,x,{view:v});$.innerHTML='<p class="text-center mut py-10">كنحملو...</p>';LH='';render();window.scrollTo(0,0)};

async function load(uid){S.me=await q(sb.from('profiles').select('*').eq('id',uid).single());try{S.paymode=(await sb.from('app_settings').select('value').eq('key','paymode').maybeSingle()).data?.value||'free'}catch(e){}if(DL){const x=DL;DL=null;return go('req',{sel:+x})}go(home())}
async function act(a,t){const g=id=>(document.getElementById(id)||{}).value||'';const n=id=>+g(id);
 if(a==='signup'){const name=g('a-name').trim(),ph=g('a-phone'),pw=g('a-pass');if(!name||ph.replace(/\D/g,'').length<9||pw.length<6)return toast('كمل المعلومات (نمرة صحيحة، كلمة سر 6 حروف).');
  const {data,error}=await sb.auth.signUp({email:em(ph),password:pw});if(error)return toast(error.message);if(!data.session)return toast('دير Confirm email = OFF فـ Supabase (Authentication > Providers > Email).');
  const uid=data.user.id;try{await q(sb.from('profiles').insert({id:uid,role:S.pick,name,truck:S.pick==='driver'?g('a-truck'):null}));await q(sb.from('private_phones').insert({user_id:uid,phone:ph.trim()}))}catch(e){await sb.auth.signOut();return}return load(uid);}
 if(a==='login'){const {data,error}=await sb.auth.signInWithPassword({email:em(g('a-phone')),password:g('a-pass')});if(error)return toast('النمرة ولا كلمة السر غالطين.');try{localStorage.setItem('tri9i_phone',g('a-phone'))}catch(e){}try{return await load(data.user.id)}catch(e){await sb.auth.signOut();S.me=null;go('auth')}}
 if(a==='saveprofile'){const u={name:g('s-name').trim(),city:g('s-city').trim()};if(S.me.role==='driver'){u.truck=g('s-truck');u.plate=g('s-plate').trim();u.capacity=g('s-cap').trim()}if(!u.name)return toast('كتب سميتك.');await q(sb.from('profiles').update(u).eq('id',S.me.id));await refreshMe();toast('تسجل!',1);return render();}
 if(a==='newpass'){const p=g('s-pass');if(p.length<6)return toast('6 حروف على الأقل.');const {error}=await sb.auth.updateUser({password:p});return error?toast(error.message):toast('تبدلات كلمة السر.',1);}
 if(a==='delphoto'){const tp=[...S.me.truck_photos],[p]=tp.splice(+t.dataset.i,1);await q(sb.from('profiles').update({truck_photos:tp}).eq('id',S.me.id));await sb.storage.from('photos').remove([p]);await refreshMe();return render();}
 if(a==='rate'){const r=await q(sb.from('requests').select('agreed_driver').eq('id',S.sel).single());await q(sb.from('reviews').insert({request_id:S.sel,driver_id:r.agreed_driver,stars:+t.dataset.s}));return render();}
 if(a==='verify'){await q(sb.rpc('set_verified',{uid:t.dataset.u,v:true}));return render();}
 if(a==='posttrip'){const d={from_city:g('t-from'),to_city:g('t-to'),trip_date:g('t-date'),capacity:g('t-cap').trim(),note:g('t-note').trim()};if(!d.from_city||!d.to_city||!d.trip_date)return toast('عمر كاع الخانات.');await q(sb.from('trips').insert(d));toast('تنشرات الرحلة!',1);return go(home());}
 if(a==='deltrip'){await q(sb.from('trips').delete().eq('id',+t.dataset.t));return render();}
 if(a==='usetrip'){S.wz={...WZ(),f:t.dataset.f,t:t.dataset.t,d:t.dataset.d,step:2};return go('new');}
 if(a==='filter'){S.filt={f:g('f-from'),t:g('f-to')};return render();}
 if(a==='cancel'){if(!confirm('بغيتي تلغي هاد الطلب؟'))return;await q(sb.rpc('cancel_request',{rid:S.sel}));return go(home());}
 if(a==='wz'){const k=t.dataset.k;S.wz[k]=k==='b'?+t.dataset.v:t.dataset.v;if(!t.dataset.stay)S.wz.step++;return render();}
 if(a==='wznext'){const w=S.wz;if(w.step===2){if(!w.w)return toast('اختار نوع السلعة.');w.det=g('w-det').trim();w.step=3}else if(w.step===4){const p=n('p-cus');if(p>0)w.b=p;if(!(w.b>0))return toast('كتب الثمن.');w.step=5}return render();}
 if(a==='wzback'){if(S.wz.step>0){S.wz.step--;return render()}return go(home());}
 if(a==='showpass'){const e=document.getElementById('a-pass');e.type=e.type==='password'?'text':'password';return;}
 if(a==='seen'){try{localStorage.setItem('tri9i_seen','1')}catch(e){}return render();}
 if(a==='report'){const t0=prompt('شنو هو المشكل؟');if(!t0||!t0.trim())return;await q(sb.from('reports').insert({request_id:S.sel,body:t0.trim()}));return toast('توصلنا بالمشكل، غادي نتصلو بيك.',1);}
 if(a==='payout'){await q(sb.rpc('mark_payout',{rid:+t.dataset.r}));return render();}
 if(a==='resolve'){await q(sb.rpc('resolve_report',{rid:+t.dataset.r}));return render();}
 if(a==='achat')return go('chat',{chatWith:t.dataset.d});
 if(a==='aset'){await q(sb.rpc('admin_set_status',{rid:S.sel,st:g('a-st')}));toast('تبدلات الحالة.',1);return render();}
 if(a==='aver'){await q(sb.rpc('set_verified',{uid:t.dataset.u,v:t.dataset.v==='1'}));return render();}
 if(a==='mic'){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('هاد المتصفح ما كيدعمش الصوت. كتب بلاصتو.');const r=new SR();r.lang='ar-MA';r.interimResults=false;r.onresult=e=>{document.getElementById('ai-txt').value=e.results[0][0].transcript};r.onerror=()=>toast('ما فهمتش الصوت، عاود.');r.start();return;}
 if(a==='aiparse'){const text=g('ai-txt').trim();if(text.length<5)return toast('كتب ولا هضر شوية.');toast('المساعد كيفهم...',1);const {data,error}=await sb.functions.invoke('ai',{body:{task:'parse',text,today:today()}});if(error||!data||!data.result)return toast('المساعد ما خدمش دابا'+(error?' ('+await aiErr(error)+')':'')+'. عمر الطلب بالأزرار.');const o=data.result,w=S.wz;if(CITIES.includes(o.from_city))w.f=o.from_city;if(CITIES.includes(o.to_city))w.t=o.to_city;if(GOODS.includes(o.goods))w.w=o.goods;if(o.details)w.det=String(o.details).slice(0,80);if(/^\d{4}-\d\d-\d\d$/.test(o.date||'')&&o.date>=today())w.d=o.date;if(+o.price>0)w.b=Math.round(+o.price);w.step=!w.f?0:!w.t?1:!w.w?2:!w.d?3:!(w.b>0)?4:5;toast('تعمر الطلب، راجع وكمل.',1);return render();}
 if(a==='aisend'){const qx=g('ai-q').trim();if(!qx)return;S.ai.push({role:'user',content:qx},{role:'assistant',content:'...'});render();const {data,error}=await sb.functions.invoke('ai',{body:{task:'assist',messages:S.ai.slice(0,-1),fee:FEE_EACH,paymode:S.paymode}});S.ai[S.ai.length-1].content=(!error&&data&&data.reply)||('المساعد ما خدمش دابا.'+(error?' ('+await aiErr(error)+')':''));return render();}
 if(a==='asum'){const o=document.getElementById('sumout');o.innerHTML='<p class="mut">كنلخصو...</p>';const M=await q(sb.from('messages').select('body,s:sender_id(name,role)').eq('request_id',S.sel).eq('driver_id',t.dataset.d).order('created_at').limit(80)),R=await q(sb.from('reports').select('body').eq('request_id',S.sel)),txt=(R.length?'مشاكل مبلغ عليها:\n'+R.map(x=>x.body).join('\n')+'\n\n':'')+'المحادثة:\n'+M.map(m=>`${m.s?m.s.name+' ('+m.s.role+')':'؟'}: ${m.body}`).join('\n');const {data,error}=await sb.functions.invoke('ai',{body:{task:'summarize',text:txt}});o.innerHTML=`<div class="card p-4 tg" style="border:0"><p class="font-bold mb-1">ملخص المساعد</p><p style="white-space:pre-wrap">${esc(error||!data||!data.summary?'ما قدرتش نلخص دابا.':data.summary)}</p></div>`;return;}
 if(a==='feesent'){await q(sb.rpc('mark_fee_sent',{rid:S.sel}));return render();}
 if(a==='setmode'){if(!confirm('بدل نظام الخلاص؟ غادي يطبق على الطلبات الجداد.'))return;await q(sb.rpc('set_paymode',{m:t.dataset.m}));S.paymode=t.dataset.m;return render();}
 if(a==='logout'){await sb.auth.signOut();S.me=null;return go('auth');}
 if(a==='publish'){const w=S.wz,ad=g('w-addr').trim();if(!ad)return toast('كتب عنوان التحميل.');const d={from_city:w.f,to_city:w.t,what:w.w+(w.det?' - '+w.det:''),budget:w.b,pickup_date:w.d,truck_wanted:g('w-truck')||null,needs_help:!!(document.getElementById('w-help')||{}).checked,photos:w.ph||[]};const r=await q(sb.from('requests').insert(d).select().single());await q(sb.from('request_private').insert({request_id:r.id,addr:ad}));S.wz=WZ();S.pre={};return go('req',{sel:r.id});}
 if(a==='offer'){const p=n('o-price');if(!(p>0))return;await q(sb.from('offers').insert({request_id:S.sel,driver_id:S.me.id,by_role:'driver',price:p}));return render();}
 if(a==='counter'){const p=n('c-'+t.dataset.o);if(!(p>0))return;await q(sb.from('offers').insert({request_id:S.sel,driver_id:t.dataset.d,by_role:'shipper',price:p}));return render();}
 if(a==='accept'){await q(sb.rpc('accept_offer',{oid:+t.dataset.o}));const st=await q(sb.from('requests').select('status').eq('id',S.sel).single());return S.me.role==='shipper'&&st.status==='agreed'?go('pay'):render();}
 if(a==='pay'){await q(sb.rpc('submit_payment',{rid:S.sel,m:'virement'}));return go('req');}
 if(a==='deliver'){await q(sb.rpc('mark_delivered',{rid:S.sel}));return render();}
 if(a==='confirm'){await q(sb.rpc('confirm_delivery',{rid:S.sel}));return render();}
 if(a==='confirmpay'){await q(sb.rpc('confirm_payment',{pid:+t.dataset.p}));return render();}
 if(a==='openchat')return go('chat',{chatWith:t.dataset.d});
 if(a==='send'){const body=g('m-text').trim();if(!body)return;await q(sb.from('messages').insert({request_id:S.sel,driver_id:S.chatWith,body}));return render();}
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-open],[data-act],[data-pick],[data-mode],#logo');if(!t)return;
 if(t.id==='logo')return S.me?go(home()):null;
 if(t.dataset.pick){S.pick=t.dataset.pick;return render()}
 if(t.dataset.mode){S.mode=t.dataset.mode;return render()}
 if(t.dataset.open)return S.me&&S.me.role==='admin'?go('areq',{sel:+t.dataset.open}):go('req',{sel:+t.dataset.open});
 if(t.dataset.go==='new')S.wz=WZ();if(t.dataset.go)return go(t.dataset.go==='sh'||t.dataset.go==='dr'||t.dataset.go==='admin'?home():t.dataset.go);
 act(t.dataset.act,t).catch(console.error);});
document.addEventListener('input',e=>{const k=e.target.dataset.cs;if(!k)return;const v=nz(e.target.value.trim()),h=CITIES_SORTED.filter(c=>nz(c).includes(v)).map(c=>`<button class="pill tb cb" style="font-size:15px;padding:8px 14px" data-act="wz" data-k="${k}" data-v="${c}">${c}</button>`).join('');document.getElementById('cl').innerHTML=h||'<span class="mut">ما لقينا والو</span>'});
document.addEventListener('change',async e=>{const z=e.target.dataset.wz;if(z){if(!e.target.value)return;S.wz[z]=e.target.value;if(z==='f'||z==='t'||z==='d')S.wz.step++;return render()}const k=e.target.dataset.up,f=e.target.files&&e.target.files[0];if(!k||!f)return;try{toast('كنطلعو الصورة...',1);const m=S.me;
 if(k==='gph'){S.wz.det=(document.getElementById('w-det')||{}).value||S.wz.det;const p=await upload('photos',f);(S.wz.ph=S.wz.ph||[]).push(p);toast('طلعات!',1);return render()}
 if(k==='av'){const p=await upload('photos',f);await q(sb.from('profiles').update({avatar:p}).eq('id',m.id))}
 if(k==='truck'){const p=await upload('photos',f);await q(sb.from('profiles').update({truck_photos:[...(m.truck_photos||[]),p]}).eq('id',m.id))}
 if(k==='doc'){const p=await upload('docs',f);await q(sb.from('profiles').update({docs:[...(m.docs||[]),p]}).eq('id',m.id))}
 await refreshMe();toast('طلعات!',1);render()}catch(x){console.error(x)}});
setInterval(()=>{const a=document.activeElement;if(!S.me||S.view==='settings'||document.hidden||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))return;render()},20000);
(()=>{const h=document.getElementById('help');h.href='https://wa.me/'+BANK.wa+'?text='+encodeURIComponent('سلام، بغيت مساعدة فـ TRi9i');h.innerHTML=ic('chat',22)+'مساعدة'})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
sb.auth.getSession().then(async({data})=>{if(!data.session)return render();try{await load(data.session.user.id)}catch(e){console.error(e);await sb.auth.signOut();S.me=null;go('auth')}}).catch(e=>{console.error(e);render()});
</script>
